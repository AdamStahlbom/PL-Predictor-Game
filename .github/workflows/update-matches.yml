name: Update Match Results

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Ping my Next.js API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS -X GET "https://www.adamstahlbom.se/api/fetch-matches" \
            -H "Authorization: Bearer $CRON_SECRET"
